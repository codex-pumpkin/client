<card-layout
  [title]="(reset() ? 'password_reset.title.reset' : 'password_reset.title.initial') | translate"
  [description]="(reset() ? 'password_reset.description.reset' : 'password_reset.description.initial') | translate">

  <div id="content">
    @if (reset()) {
      <button matButton="filled" (click)="continue()">{{'password_reset.continue.label' | translate}}</button>
    } @else {
      <mat-form-field appearance="outline">
        <mat-label>{{ 'password_reset.password.label' | translate }}</mat-label>
        <input [formControl]="password.control" matInput [type]="passwordVisibility() ? 'text' : 'password'">

        @if (password.control.invalid) {
          <mat-error>{{ password.errorKey() | translate }}</mat-error>
        }

        <button matSuffix matIconButton (click)="togglePasswordVisibility()">
          <mat-icon>{{ passwordVisibility() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (genericError() != null) {
        <p id="generic-error">{{genericError() | translate }}</p>
      }

      <button matButton="filled" (click)="resetPassword()">{{'password_reset.perform_reset.label' | translate}}</button>
    }
  </div>

</card-layout>
