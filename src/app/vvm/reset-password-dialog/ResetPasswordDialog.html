<h2 mat-dialog-title>{{ 'dialog.reset_password.title' | translate }}</h2>
<mat-dialog-content>
  <p id="description">{{ 'dialog.reset_password.description' | translate }}</p>

</mat-dialog-content>
<mat-dialog-actions>
  <button (click)="cancel()" matButton>{{ 'dialog.reset_password.negative' | translate }}</button>
  <button (click)="confirm()" matButton>{{ 'dialog.reset_password.positive' | translate }}</button>
</mat-dialog-actions>
