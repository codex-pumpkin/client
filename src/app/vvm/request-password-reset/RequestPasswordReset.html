<card-layout
  [title]="(mailSent() ? 'request_password_reset.title.sent' : 'request_password_reset.title.initial') | translate"
  [description]="(mailSent() ? 'request_password_reset.description.sent' : 'request_password_reset.description.initial') | translate">

  <div id="content">
    @if (mailSent()) {
      <button matButton="filled" (click)="continue()">{{'request_password_reset.continue.label' | translate}}</button>
    } @else {
      <mat-form-field appearance="outline">
        <mat-label>{{ 'request_password_reset.email.label' | translate }}</mat-label>
        <input [formControl]="email.control" matInput>

        @if (email.control.invalid) {
          <mat-error>{{ email.errorKey() | translate }}</mat-error>
        }
      </mat-form-field>

      @if (genericError() != null) {
        <p id="generic-error">{{genericError() | translate }}</p>
      }

      <button matButton="filled" (click)="requestPasswordReset()">{{'request_password_reset.send_mail.label' | translate}}</button>
    }
  </div>

</card-layout>
