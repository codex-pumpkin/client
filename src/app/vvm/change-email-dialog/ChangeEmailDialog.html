<h2 mat-dialog-title>{{ 'dialog.change_email.title' | translate }}</h2>
<mat-dialog-content>
  <p id="description">{{ 'dialog.change_email.description' | translate }}</p>
  <mat-form-field appearance="outline">
    <mat-label>{{ 'dialog.change_email.name.label' | translate }}</mat-label>
    <input [formControl]="email.control" matInput />

    @if (email.control.invalid) {
      <mat-error>{{ email.errorKey() | translate }}</mat-error>
    }
  </mat-form-field>

</mat-dialog-content>
<mat-dialog-actions>
  <button (click)="cancel()" matButton>{{ 'dialog.change_email.negative' | translate }}</button>
  <button (click)="confirm()" matButton>{{ 'dialog.change_email.positive' | translate }}</button>
</mat-dialog-actions>
