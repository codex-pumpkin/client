<div id="root">
  <img ngSrc="/assets/logo.svg" alt="Logo" height="46" width="120">

  <div id="card-container">

    <ng-template #child>
      <ng-content></ng-content>
    </ng-template>

    <div id="pseudo-card" *ngIf="isMobile(); else nonmobile">
      <p class="title">{{title()}}</p>
      <p class="content" [innerHTML]="description()"></p>
      <ng-container *ngTemplateOutlet="child"></ng-container>
    </div>

    <ng-template #nonmobile>
      <mat-card appearance="filled">
        <mat-card-title class="title">{{ title() }}</mat-card-title>
        <mat-card-content class="content">
          <p [innerHTML]="description()"></p>
          <ng-container *ngTemplateOutlet="child"></ng-container>
        </mat-card-content>
      </mat-card>
    </ng-template>
  </div>
</div>
