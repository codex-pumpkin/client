<div id="content">
  <input
    id="search-input"
    [formControl]="control()!"
    [placeholder]="'prompt_input.placeholder' | translate"
    (keydown.enter)="sendCallback.emit()"
  >
  <button id="prompt-input-send" matIconButton (click)="click()" [disabled]="disabled()">
    <mat-icon>send</mat-icon>
  </button>
</div>
