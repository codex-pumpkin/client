<h2 mat-dialog-title>{{ 'dialog.change_conversation_name.title' | translate }}</h2>
<mat-dialog-content>
  <p id="description">{{ 'dialog.change_conversation_name.description' | translate }}</p>
  <mat-form-field appearance="outline">
    <mat-label>{{ 'dialog.change_conversation_name.name.label' | translate }}</mat-label>
    <input [formControl]="name.control" matInput />

    @if (name.control.invalid) {
      <mat-error>{{ name.errorKey() | translate }}</mat-error>
    }
  </mat-form-field>

</mat-dialog-content>
<mat-dialog-actions>
  <button (click)="cancel()" matButton>{{ 'dialog.change_conversation_name.negative' | translate }}</button>
  <button (click)="confirm()" matButton>{{ 'dialog.change_conversation_name.positive' | translate }}</button>
</mat-dialog-actions>
